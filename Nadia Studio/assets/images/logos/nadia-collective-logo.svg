<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#E5C785"/>
      <stop offset="100%" stop-color="#A88038"/>
    </linearGradient>
  </defs>
  <!-- Monogram Crest -->
  <g transform="translate(10, 10)">
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="50" cy="50" r="41" fill="none" stroke="#2C2623" stroke-width="1"/>
    <!-- Letter N -->
    <text x="50" y="63" font-family="'Playfair Display', 'Cormorant Garamond', serif" font-size="38" font-style="italic" font-weight="600" fill="#2C2623" text-anchor="middle">N</text>
    <!-- Little star/sparkle -->
    <path d="M50 14 L52 20 L58 22 L52 24 L50 30 L48 24 L42 22 L48 20 Z" fill="url(#goldGrad)"/>
  </g>
  <!-- Text Brand -->
  <g transform="translate(125, 20)">
    <text x="0" y="44" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="34" font-weight="600" letter-spacing="4" fill="#2C2623">NADIA</text>
    <text x="2" y="70" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="7" fill="#8C7A6B">COLLECTIVE</text>
    <line x1="2" y1="82" x2="220" y2="82" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>
</svg>
